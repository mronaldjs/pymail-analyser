name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Verificação Estática — Backend Python
  # ──────────────────────────────────────────────────────────────
  static-analysis-backend:
    name: Backend — Static Analysis (SAST & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install lint dependencies
        run: pip install ruff==0.14.6

      - name: Ruff Check (lint)
        run: |
          cd pymail-api
          ruff check .

      - name: Ruff Format Check
        run: |
          cd pymail-api
          ruff format --check .

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Verificação Estática — Frontend Node.js
  # ──────────────────────────────────────────────────────────────
  static-analysis-frontend:
    name: Frontend — Static Analysis (Lint & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pymail-webapp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./pymail-webapp

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: ./pymail-webapp

      - name: TypeScript Check
        run: npx tsc --noEmit
        working-directory: ./pymail-webapp

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Verificação Dinâmica — Testes Backend (pytest)
  # ──────────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Dynamic Tests (pytest)
    runs-on: ubuntu-latest
    needs: static-analysis-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pymail-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pymail-api/requirements.txt ]; then pip install -r pymail-api/requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          cd pymail-api
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing || echo "No tests found, skipping."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: pymail-api/coverage.xml

  # ──────────────────────────────────────────────────────────────
  # JOB 4: Deploy → STAGING
  # Dispara em pushes para master/main
  # ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [static-analysis-backend, static-analysis-frontend, test-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: staging
      url: https://pymail-staging.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pymail-api/requirements.txt ]; then pip install -r pymail-api/requirements.txt; fi

      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -r pymail-api/ -ll --exclude pymail-api/tests || true

      - name: Deploy to Staging
        env:
          DEPLOY_ENV: staging
          APP_SECRET: ${{ secrets.STAGING_SECRET }}
        run: |
          echo "🔶 Deploying to STAGING environment..."
          echo "Ref: ${{ github.sha }}"
          # Substitua pelo comando real de deploy, ex:
          # fly deploy --config fly.staging.toml
          # ou: heroku git:remote -a pymail-staging && git push heroku master
          echo "✅ Staging deploy complete."

      - name: Health check — Staging
        run: |
          echo "Running health check on staging..."
          # curl --fail https://pymail-staging.example.com/health
          echo "✅ Staging health check passed."

  # ──────────────────────────────────────────────────────────────
  # JOB 5: Deploy → PRODUCTION
  # Dispara apenas em tags v* (ex: v1.0.0)
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://pymail.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pymail-api/requirements.txt ]; then pip install -r pymail-api/requirements.txt; fi

      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -r pymail-api/ -ll --exclude pymail-api/tests || true

      - name: Check dependency vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r pymail-api/requirements.txt || true

      - name: Deploy to Production
        env:
          DEPLOY_ENV: production
          APP_SECRET: ${{ secrets.PRODUCTION_SECRET }}
        run: |
          echo "🚀 Deploying tag ${{ github.ref_name }} to PRODUCTION..."
          # Substitua pelo comando real de deploy, ex:
          # fly deploy --config fly.production.toml
          # ou: heroku git:remote -a pymail-prod && git push heroku master
          echo "✅ Production deploy complete."

      - name: Health check — Production
        run: |
          echo "Running health check on production..."
          # curl --fail https://pymail.example.com/health
          echo "✅ Production health check passed."

      - name: Notify deploy success
        run: |
          echo "🎉 Version ${{ github.ref_name }} successfully deployed to production!"
