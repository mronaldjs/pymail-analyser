name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pymail-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pymail-api/requirements.txt ]; then pip install -r pymail-api/requirements.txt; fi
          pip install ruff==0.14.6 pytest pytest-cov

      - name: Lint (ruff)
        run: |
          cd pymail-api
          ruff check .

      - name: Run backend tests
        run: |
          cd pymail-api
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml || echo "No tests found, skipping."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: pymail-api/coverage.xml
