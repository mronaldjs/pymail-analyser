name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis-backend:
    name: Backend - Static Analysis (SAST & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ruff
      - name: Ruff Check
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .

  static-analysis-frontend:
    name: Frontend - Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
        working-directory: ./pymail-webapp
      - name: Lint
        run: npm run lint
        working-directory: ./pymail-webapp
      - name: TypeScript Check
        run: npx tsc --noEmit
        working-directory: ./pymail-webapp

  schema-contract-check:
    name: Schema Sync Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenAPI Contract
        run: |
          make openapi
          npm run gen:types --prefix frontend
          git diff --exit-code

  security-sast:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  dynamic-test-backend:
    name: Backend - Dynamic Tests
    runs-on: ubuntu-latest
    needs: [static-analysis-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r pymail-api/requirements.txt pytest pytest-cov
      - name: Run Pytest
        run: pytest -q --cov=services --cov=routers
        working-directory: ./pymail-api

  dynamic-test-frontend:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    needs: [static-analysis-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
        working-directory: ./pymail-webapp
      - name: Run Vitest
        run: npm run test:run
        working-directory: ./pymail-webapp

  dynamic-test-e2e:
    name: Frontend - E2E Tests
    runs-on: ubuntu-latest
    needs: [dynamic-test-frontend, dynamic-test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm ci
        working-directory: ./pymail-webapp
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./pymail-webapp
      - name: Run E2E tests
        run: npx playwright test
        working-directory: ./pymail-webapp

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [dynamic-test-backend, dynamic-test-e2e, schema-contract-check, security-sast]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./pymail-api
          push: false
          tags: pymail-analyser-backend:latest
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./pymail-webapp
          push: false
          tags: pymail-analyser-frontend:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Docker Compose
        run: docker compose up -d
      - name: Smoke Test (Healthcheck)
        run: |
          sleep 10
          curl -f http://localhost:8000/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d
      - name: Final Validation
        run: |
          sleep 10
          curl -f http://localhost:8000/health || exit 1
